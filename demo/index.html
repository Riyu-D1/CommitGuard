<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CommitGuard - the pre-send firewall</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #2d3545;
    --text: #e6edf3; --dim: #8b98a9; --accent: #58a6ff;
    --crit: #f85149; --high: #f0883e; --med: #d29922; --ok: #3fb950;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "SF Mono", Menlo, monospace; }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--border); }
  header h1 { font-size:17px; font-weight:600; }
  header .tag { color:var(--dim); font-size:12px; }
  .chip { padding:2px 9px; border-radius:10px; font-size:11px; border:1px solid var(--border); color:var(--dim); }
  .chip.ok { color:var(--ok); border-color:var(--ok); }
  .chip.bad { color:var(--crit); border-color:var(--crit); }
  .wrap { display:grid; grid-template-columns: 1fr 340px; gap:16px; padding:16px 20px; max-width:1200px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .scenarios { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .scenarios button, .btn { background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:7px; padding:6px 12px; font:inherit; font-size:12px; cursor:pointer; }
  .scenarios button:hover, .btn:hover { border-color:var(--accent); }
  .btn.primary { background:var(--accent); color:#0d1117; border-color:var(--accent); font-weight:600; }
  .btn.danger { color:var(--crit); border-color:var(--crit); }
  .btn:disabled { opacity:.35; cursor:not-allowed; }
  input, textarea { width:100%; background:var(--panel2); border:1px solid var(--border); border-radius:7px;
    color:var(--text); font:inherit; padding:8px 10px; }
  input { margin-bottom:8px; }
  textarea { min-height:180px; resize:vertical; }
  .status-row { display:flex; align-items:center; gap:10px; margin:10px 0; min-height:22px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--crit); } .dot.spin { background:var(--med); }
  .v { border-left:3px solid var(--med); background:var(--panel2); border-radius:0 8px 8px 0;
    padding:10px 12px; margin:8px 0; }
  .v.CRITICAL { border-color:var(--crit); } .v.HIGH { border-color:var(--high); }
  .v.MEDIUM { border-color:var(--med); } .v.LOW { border-color:var(--dim); }
  .v .cat { font-size:11px; font-weight:700; letter-spacing:.05em; }
  .v.CRITICAL .cat { color:var(--crit); } .v.HIGH .cat { color:var(--high); }
  .v .issue { margin:4px 0; }
  .v .ev { font-size:11px; color:var(--dim); margin:4px 0; }
  .v .ev b { color:var(--accent); font-weight:600; }
  .v .corr { font-size:12px; color:var(--ok); }
  .actions { display:flex; gap:8px; margin-top:12px; }
  .rail { display:flex; flex-direction:column; gap:16px; }
  .rail h3 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; }
  pre { font-size:11px; color:var(--dim); white-space:pre-wrap; max-height:260px; overflow:auto;
    background:var(--panel2); border-radius:7px; padding:10px; }
  .audit-item { font-size:11px; color:var(--dim); border-bottom:1px solid var(--border); padding:6px 0; }
  .audit-item b { color:var(--text); }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel2);
    border:1px solid var(--ok); color:var(--ok); padding:10px 18px; border-radius:8px; display:none; }
</style>
</head>
<body>
<header>
  <h1>CommitGuard</h1>
  <span class="tag">the pre-send firewall &mdash; nothing leaves the company the brain can't back up</span>
  <span class="chip" id="engine">engine: &mdash;</span>
</header>
<div class="wrap">
  <div class="panel">
    <div class="scenarios" id="scenarios"></div>
    <input id="to" placeholder="To: priya@acme.com">
    <input id="subject" placeholder="Subject">
    <textarea id="body" placeholder="Draft your message or paste an invoice..."></textarea>
    <div class="status-row">
      <span class="dot" id="dot"></span>
      <span id="statusText" style="color:var(--dim)">idle</span>
      <span id="latency" style="color:var(--dim); font-size:11px; margin-left:auto"></span>
    </div>
    <div id="violations"></div>
    <div class="actions">
      <button class="btn primary" id="sendBtn" disabled>Send</button>
      <button class="btn" id="fixBtn" disabled>Apply all fixes</button>
      <button class="btn" id="stageBtn" style="display:none">Stage in Round</button>
      <button class="btn danger" id="escalateBtn" style="display:none">Escalate to CFO</button>
      <button class="btn" id="overrideBtn" disabled>Send anyway</button>
    </div>
  </div>
  <div class="rail">
    <div class="panel"><h3>Company Brain</h3><pre id="brain">loading...</pre></div>
    <div class="panel"><h3>Audit log</h3><div id="audit"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let lastResult = null, debounce = null;

async function api(path, method="GET", body=null) {
  const r = await fetch(path, {method, headers:{"Content-Type":"application/json"},
    body: body ? JSON.stringify(body) : null});
  return r.json();
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 3200);
}

async function loadScenarios() {
  const s = await api("/scenarios");
  for (const [key, sc] of Object.entries(s)) {
    const b = document.createElement("button");
    b.textContent = sc.label;
    b.onclick = () => { $("body").value = sc.text; verify(); };
    $("scenarios").appendChild(b);
  }
}

async function loadBrain() { $("brain").textContent = JSON.stringify(await api("/brain"), null, 2); }

async function loadAudit() {
  const rows = await api("/audit-log?limit=8");
  $("audit").innerHTML = rows.map(r =>
    `<div class="audit-item"><b>${r.action_type}</b> &middot; ${r.audit_log_id}<br>${r.ts}</div>`).join("");
}

async function verify() {
  const text = $("body").value.trim();
  if (!text) { reset(); return; }
  $("dot").className = "dot spin"; $("statusText").textContent = "checking against company brain...";
  const res = await api("/verify-context", "POST", {text, context_type:"outgoing_email"});
  lastResult = res;
  $("engine").textContent = "engine: " + res.meta.engine;
  $("latency").textContent = res.meta.latency_ms + "ms · " + res.meta.checks_run + " checks";

  if (res.status === "CLEAN") {
    $("dot").className = "dot ok"; $("statusText").textContent = "CLEAR - brain-backed send";
    $("violations").innerHTML = ""; $("sendBtn").disabled = false;
    $("fixBtn").disabled = $("overrideBtn").disabled = true;
    $("stageBtn").style.display = $("escalateBtn").style.display = "none";
    return;
  }
  $("dot").className = "dot bad"; $("statusText").textContent =
    `${res.violations.length} violation${res.violations.length>1?"s":""} - risk ${res.risk_level}`;
  $("violations").innerHTML = res.violations.map(v => `
    <div class="v ${v.severity}">
      <div class="cat">${v.severity} · ${v.category}</div>
      <div class="issue">${v.issue}</div>
      ${v.evidence ? `<div class="ev">brain: <b>${v.evidence.brain_key}</b> = ${JSON.stringify(v.evidence.expected)} · found: ${JSON.stringify(v.evidence.found)}</div>` : ""}
      <div class="corr">→ ${v.correction}</div>
    </div>`).join("");
  const hasCrit = res.violations.some(v => v.severity === "CRITICAL");
  $("sendBtn").disabled = true;
  $("fixBtn").disabled = !res.suggested_rewrite;
  $("overrideBtn").disabled = hasCrit;
  $("escalateBtn").style.display = hasCrit ? "" : "none";
  $("stageBtn").style.display = /invoice|due|iban/i.test(text) ? "" : "none";
}

$("body").addEventListener("input", () => {
  clearTimeout(debounce); debounce = setTimeout(verify, 700);
});

$("fixBtn").onclick = () => {
  if (lastResult?.suggested_rewrite) { $("body").value = lastResult.suggested_rewrite; verify(); }
};
$("sendBtn").onclick = async () => {
  const r = await api("/execute-action", "POST",
    {action_type:"SEND_APPROVED", payload:{text:$("body").value}});
  toast(r.message); loadAudit();
};
$("overrideBtn").onclick = async () => {
  const reason = prompt("Override reason (written to audit log):");
  if (!reason) return;
  const r = await api("/execute-action", "POST",
    {action_type:"APPROVE_OVERRIDE", payload:{reason, text:$("body").value}});
  toast(r.message); loadAudit();
};
$("escalateBtn").onclick = async () => {
  const r = await api("/execute-action", "POST",
    {action_type:"ESCALATE_FRAUD", payload:{text:$("body").value, violations:lastResult?.violations}});
  toast(r.message); loadAudit();
};
$("stageBtn").onclick = async () => {
  const r = await api("/execute-action", "POST",
    {action_type:"STAGE_INVOICE", payload:{text:$("body").value}});
  toast(r.message); loadAudit();
};

function reset() {
  $("dot").className = "dot"; $("statusText").textContent = "idle";
  $("violations").innerHTML = ""; $("latency").textContent = "";
  $("sendBtn").disabled = $("fixBtn").disabled = $("overrideBtn").disabled = true;
  $("stageBtn").style.display = $("escalateBtn").style.display = "none";
}

loadScenarios(); loadBrain(); loadAudit(); setInterval(loadAudit, 4000);
</script>
</body>
</html>
