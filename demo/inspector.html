<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CommitGuard Inspector — compliance console</title>
<style>
/* Nothing design system · dark mode (OLED) — same tokens as index.html.
   Fonts vendored under /vendor/fonts — no CDN, works offline. */
@font-face { font-family:'Doto'; src:url('/vendor/fonts/doto-100-900.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
@font-face { font-family:'Space Grotesk'; src:url('/vendor/fonts/space-grotesk-300-700.woff2') format('woff2'); font-weight:300 700; font-display:swap; }
@font-face { font-family:'Space Mono'; src:url('/vendor/fonts/space-mono-400.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:swap; }
@font-face { font-family:'Space Mono'; src:url('/vendor/fonts/space-mono-700.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:swap; }
:root {
  --black:#000000; --surface:#111111; --surface-raised:#1A1A1A;
  --border:#222222; --border-visible:#333333;
  --text-disabled:#666666; --text-secondary:#999999;
  --text-primary:#E8E8E8; --text-display:#FFFFFF;
  --accent:#D71921; --accent-subtle:rgba(215,25,33,.14);
  --success:#4A9E5C; --warning:#D4A843;
  --ease:cubic-bezier(.25,.1,.25,1);
}
* { box-sizing:border-box; margin:0; }
body {
  background:var(--black); color:var(--text-primary);
  font:400 14px/1.5 'Space Grotesk', system-ui, sans-serif; min-height:100vh;
}
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background:var(--border-visible); }
::-webkit-scrollbar-track { background:var(--black); }
button { font-family:'Space Mono',monospace; cursor:pointer; background:none; border:none; color:inherit; }

.top {
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:24px;
  padding:0 28px; height:56px; background:var(--black); border-bottom:1px solid var(--border);
}
.mark { display:flex; align-items:baseline; gap:12px; }
.mark b { font:500 15px 'Space Grotesk',sans-serif; letter-spacing:.14em; color:var(--text-display); }
.mark b::before {
  content:""; display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--accent); margin-right:9px; vertical-align:1px;
}
.mark span { font:400 10px 'Space Mono',monospace; letter-spacing:.12em; color:var(--text-disabled); }
.pills { margin-left:auto; display:flex; align-items:center; gap:10px; }
.pill {
  display:inline-flex; align-items:center; gap:7px; height:28px; padding:0 13px;
  border:1px solid var(--border-visible); border-radius:999px;
  font:400 10px 'Space Mono',monospace; letter-spacing:.09em; color:var(--text-secondary);
  text-decoration:none; white-space:nowrap;
}
.pill .dot { width:6px; height:6px; border-radius:50%; background:var(--text-disabled); }
.pill.ok .dot { background:var(--success); }
.pill.bad { color:var(--accent); border-color:var(--accent); }
.pill.bad .dot { background:var(--accent); }
.pill.link { color:var(--text-disabled); }
.pill.link:hover { color:var(--text-display); border-color:var(--text-secondary); }
.clock { font:400 11px 'Space Mono',monospace; letter-spacing:.08em; color:var(--text-secondary); }

.grid {
  display:grid; grid-template-columns:1.15fr 1.35fr .9fr; gap:48px;
  padding:36px 40px 80px; max-width:1680px;
}
@media (max-width:1150px) { .grid { grid-template-columns:1fr; } }
h2 { font:400 11px 'Space Mono',monospace; letter-spacing:.14em; color:var(--text-display); font-weight:400; margin-bottom:18px; }
h2 .n { color:var(--text-disabled); }
h2 button { float:right; font:400 9px 'Space Mono',monospace; letter-spacing:.1em; color:var(--text-disabled); }
h2 button:hover { color:var(--text-display); }

.card { border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
.card h3 { font:500 13px 'Space Grotesk',sans-serif; color:var(--text-primary); margin-bottom:6px; }
.kv { display:flex; justify-content:space-between; gap:16px; padding:3px 0; font-size:12px; }
.kv .k { font:400 9.5px 'Space Mono',monospace; letter-spacing:.08em; color:var(--text-disabled); text-transform:uppercase; padding-top:2px; }
.kv .v { color:var(--text-primary); text-align:right; font:400 11.5px 'Space Mono',monospace; }
.kv .v.ok { color:var(--success); }
.kv .v.warn { color:var(--warning); }
.tag { display:inline-block; border:1px solid var(--border-visible); border-radius:4px; padding:2px 8px; margin:2px 4px 2px 0; font:400 9px 'Space Mono',monospace; letter-spacing:.06em; color:var(--text-secondary); }
.empty { padding:36px 0; font:400 10px 'Space Mono',monospace; letter-spacing:.1em; color:var(--text-disabled); }

table { width:100%; border-collapse:collapse; }
thead th {
  text-align:left; font:400 9px 'Space Mono',monospace; letter-spacing:.12em; color:var(--text-disabled);
  text-transform:uppercase; padding:0 10px 10px; border-bottom:1px solid var(--border-visible);
}
td { padding:9px 10px; border-bottom:1px solid var(--border); font:400 11px 'Space Mono',monospace; color:var(--text-secondary); vertical-align:top; }
td.act { color:var(--text-primary); }
td.res-learned, td.res-caught { color:var(--warning); }
td.res-clean, td.res-approved, td.res-answered { color:var(--success); }
tr.flash td { animation:flash 1.4s var(--ease); }
@keyframes flash { 0%{ background:var(--accent-subtle); } 100%{ background:transparent; } }

footer {
  padding:16px 28px; border-top:1px solid var(--border);
  font:400 9px 'Space Mono',monospace; letter-spacing:.12em; color:#3f3f3f;
}
</style>
</head>
<body>
<header class="top">
  <div class="mark"><b>COMMITGUARD</b><span>INSPECTOR — COMPLIANCE CONSOLE</span></div>
  <div class="pills">
    <span class="pill" id="healthPill"><span class="dot"></span>—</span>
    <span class="clock" id="clock"></span>
    <a class="pill link" href="/">← COMMAND CENTRE</a>
  </div>
</header>

<div class="grid">
  <section>
    <h2>COMPANY BRAIN <button onclick="loadBrain()">REFRESH</button></h2>
    <div id="brain"><div class="empty">[LOADING…]</div></div>
  </section>
  <section>
    <h2>AUDIT TRAIL <span class="n" id="auditN"></span></h2>
    <table>
      <thead><tr><th style="width:76px">Time</th><th>Action</th><th style="width:110px">Log ID</th><th>Result</th></tr></thead>
      <tbody id="audit"><tr><td colspan="4"><div class="empty">[LOADING…]</div></td></tr></tbody>
    </table>
  </section>
  <section>
    <h2>LIVE HEALTH</h2>
    <div id="health"><div class="empty">[LOADING…]</div></div>
    <div id="feedHealth" style="margin-top:24px"></div>
  </section>
</div>

<footer>RULES ENGINE · DETERMINISTIC · EVERY DECISION CITES A BRAIN KEY</footer>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pretty = k => k.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()).replace(/Gbp/g,'£').replace(/Iban/g,'IBAN');
const maskIban = s => s && s.length > 4 ? '••••' + s.slice(-4) : s;

async function get(path) {
  try { const r = await fetch(path); return r.ok ? await r.json() : null; }
  catch(e) { return null; }
}
setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('en-GB',{hour12:false}); }, 1000);

function kv(k, v, cls='') {
  return `<div class="kv"><span class="k">${esc(pretty(k))}</span><span class="v ${cls}">${esc(String(v))}</span></div>`;
}

function brainCards(b) {
  let h = '';
  if (b.company) h += `<div class="card"><h3>${esc(b.company.name || 'Company')}</h3>` +
    Object.entries(b.company).filter(([k]) => k !== 'name')
      .map(([k,v]) => kv(k, Array.isArray(v) ? v.join(', ') : v)).join('') + `</div>`;
  if (b.financial_rules) h += `<div class="card"><h3>Financial Rules</h3>` +
    Object.entries(b.financial_rules).map(([k,v]) => kv(k, typeof v === 'object' ? JSON.stringify(v) : v)).join('') + `</div>`;
  if (b.internal_policies) h += `<div class="card"><h3>Internal Policies</h3>` +
    Object.entries(b.internal_policies).map(([k,v]) => kv(k, typeof v === 'object' ? JSON.stringify(v) : v)).join('') + `</div>`;
  for (const c of b.signed_contracts || [])
    h += `<div class="card"><h3>Contract — ${esc(c.vendor_name)}</h3>` +
      Object.entries(c).filter(([k]) => k !== 'vendor_name')
        .map(([k,v]) => kv(k, k === 'bank_iban' ? maskIban(String(v)) : v)).join('') + `</div>`;
  if (b.engineering_status) h += `<div class="card"><h3>Engineering Status</h3>` +
    b.engineering_status.map(e => {
      const done = /merged|production|live|complete/i.test(e.status);
      return `<div class="kv"><span class="k">${esc(e.feature)}</span>` +
             `<span class="v ${done ? 'ok' : 'warn'}">${esc(e.status)}</span></div>`;
    }).join('') + `</div>`;
  for (const [key,val] of Object.entries(b)) {
    if (['company','financial_rules','internal_policies','signed_contracts','engineering_status'].includes(key)) continue;
    if (key === 'learned_rules' || key === 'learned_exceptions') {
      h += `<div class="card"><h3>${esc(pretty(key))} — ${val.length}</h3>` +
        (val.length ? val.map(r => kv(r.id || '', `"${r.phrase}" → ${r.category}`)).join('')
                    : `<div class="empty" style="padding:8px 0">EMPTY — TEACH VIA OVERRIDES</div>`) + `</div>`;
      continue;
    }
    h += `<div class="card"><h3>${esc(pretty(key))}</h3>` +
      (typeof val === 'object' && val !== null
        ? (Array.isArray(val) ? kv('values', val.join(', '))
            : Object.entries(val).map(([k,v]) => kv(k, typeof v === 'object' ? JSON.stringify(v) : v)).join(''))
        : kv('value', val)) + `</div>`;
  }
  return h;
}

async function loadBrain() {
  const b = await get('/brain');
  $('brain').innerHTML = b ? brainCards(b) : '<div class="empty">[BACKEND OFFLINE]</div>';
}

const seen = new Set();
let primed = false;
async function loadAudit() {
  const rows = await get('/audit-log?limit=40');
  if (!rows) { $('audit').innerHTML = '<tr><td colspan="4"><div class="empty">[BACKEND OFFLINE]</div></td></tr>'; return; }
  $('auditN').textContent = rows.length ? `· NEWEST ${rows.length}` : '';
  if (!rows.length) { $('audit').innerHTML = '<tr><td colspan="4"><div class="empty">NO ACTIONS YET — EVERY DECISION LANDS HERE</div></td></tr>'; primed = true; return; }
  $('audit').innerHTML = rows.map(r => {
    const isNew = primed && !seen.has(r.audit_log_id);
    seen.add(r.audit_log_id);
    const res = String(r.result || '—').toLowerCase();
    const cls = /learn|caught|violation|flagged|false_positive|held|escalat/.test(res) ? 'res-learned'
              : /clean|approv|answer|success|sent|staged/.test(res) ? 'res-clean' : '';
    return `<tr class="${isNew ? 'flash' : ''}"><td>${esc((r.ts || '').slice(11,19))}</td>` +
      `<td class="act">${esc(r.action_type || '')}</td><td>${esc(r.audit_log_id || '')}</td>` +
      `<td class="${cls}">${esc(r.result || '—')}</td></tr>`;
  }).join('');
  primed = true;
}

async function loadHealth() {
  const t0 = performance.now();
  const h = await get('/health');
  const ms = (performance.now() - t0).toFixed(0);
  const pill = $('healthPill');
  if (!h) {
    pill.className = 'pill bad';
    pill.innerHTML = '<span class="dot"></span>BACKEND OFFLINE';
    $('health').innerHTML = '<div class="empty">[BACKEND OFFLINE]</div>';
    $('feedHealth').innerHTML = '';
    return;
  }
  pill.className = 'pill ok';
  pill.innerHTML = `<span class="dot"></span>${esc((h.engine || '').toUpperCase())} · ${ms}MS`;
  $('health').innerHTML = `<div class="card"><h3>Engine</h3>` +
    kv('engine', h.engine) + kv('checks registered', h.checks) + kv('response', ms + ' ms') + `</div>` +
    `<div class="card"><h3>Brain Keys</h3><div>${(h.brain_keys || []).map(k => `<span class="tag">${esc(k)}</span>`).join('')}</div></div>`;
  const f = h.feed || {};
  $('feedHealth').innerHTML = `<h2>FEED MONITOR</h2><div class="card"><h3>Monitor</h3>` +
    kv('mode', f.mode || '—', f.mode === 'slack' ? 'ok' : 'warn') +
    kv('channel', f.channel || '—') +
    kv('last poll', f.last_poll_ts ? String(f.last_poll_ts).slice(11,19) : '—') +
    (f.error ? kv('last error', f.error, 'warn') : '') + `</div>`;
}

loadBrain(); loadAudit(); loadHealth();
setInterval(loadAudit, 4000); setInterval(loadHealth, 5000); setInterval(loadBrain, 20000);
</script>
</body>
</html>
