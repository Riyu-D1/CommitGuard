<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CommitGuard Inspector — compliance console</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2d3545;
    --text:#e6edf3; --dim:#8b98a9; --accent:#58a6ff;
    --crit:#f85149; --high:#f0883e; --med:#d29922; --ok:#3fb950;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:13px/1.5 -apple-system,"SF Mono",Menlo,monospace; }
  header { display:flex; align-items:center; gap:14px; padding:14px 20px; border-bottom:1px solid var(--border); }
  header h1 { font-size:15px; font-weight:600; }
  header a { color:var(--accent); text-decoration:none; font-size:12px; }
  header .clock { margin-left:auto; color:var(--dim); font-size:12px; }
  .grid { display:grid; grid-template-columns:1.2fr 1.4fr 1fr; gap:16px; padding:18px 20px; max-width:1400px; }
  @media (max-width:1000px){ .grid{grid-template-columns:1fr} }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .panel h3 { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px; }
  .card { background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .card .t { font-weight:600; font-size:12px; margin-bottom:4px; }
  .kv { display:flex; justify-content:space-between; font-size:11px; padding:2px 0; }
  .kv .k { color:var(--dim); } .kv .v { color:var(--text); }
  .stat-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
  .stat-dot.ok{background:var(--ok)} .stat-dot.warn{background:var(--med)}
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th { text-align:left; color:var(--dim); font-weight:600; font-size:10px; text-transform:uppercase; padding:4px 6px; border-bottom:1px solid var(--border); }
  td { padding:5px 6px; border-bottom:1px solid var(--border); color:var(--text); }
  tr.flash td { animation:flash 1.2s; }
  @keyframes flash { 0%{background:rgba(88,166,255,.35);} 100%{background:transparent;} }
  .empty { color:var(--dim); font-size:11px; font-style:italic; padding:12px 0; text-align:center; }
  .tag { display:inline-block; background:var(--panel2); border:1px solid var(--border); border-radius:5px; padding:2px 7px; font-size:10px; color:var(--dim); margin:2px 3px 2px 0; }
  .btn { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:7px; padding:5px 11px; font:inherit; font-size:11px; cursor:pointer; }
  .btn:hover { border-color:var(--accent); }
  footer { padding:12px 20px; color:var(--dim); font-size:11px; border-top:1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>CommitGuard Inspector — compliance console</h1>
  <a href="/">← Compose</a>
  <span class="clock" id="clock"></span>
</header>
<div class="grid">
  <div class="panel">
    <h3>Company Brain <button class="btn" onclick="loadBrain()" style="float:right">refresh</button></h3>
    <div id="brain"><div class="empty">loading…</div></div>
  </div>
  <div class="panel">
    <h3>Audit Trail</h3>
    <table><thead><tr><th>Time</th><th>Action</th><th>Log ID</th><th>Result</th></tr></thead>
    <tbody id="audit"><tr><td colspan="4" class="empty">loading…</td></tr></tbody></table>
  </div>
  <div class="panel">
    <h3>Live Health</h3>
    <div id="health"><div class="empty">loading…</div></div>
  </div>
</div>
<footer>rules engine &lt;5ms · fully offline · zero data retention</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pretty = k => k.replace(/_/g," ").replace(/\b\w/g, c => c.toUpperCase()).replace(/Gbp/g,"£").replace(/Iban/g,"IBAN");

async function get(path) {
  try { const r = await fetch(path); return r.ok ? await r.json() : null; }
  catch(e){ return null; }
}

setInterval(() => { $("clock").textContent = new Date().toLocaleTimeString(); }, 1000);

function maskIban(iban){ return iban && iban.length>4 ? "••••" + iban.slice(-4) : iban; }

function brainCards(b) {
  let h = "";
  if (b.financial_rules) {
    h += `<div class="card"><div class="t">Financial Rules</div>` +
      Object.entries(b.financial_rules).map(([k,v]) =>
        `<div class="kv"><span class="k">${esc(pretty(k))}</span><span class="v">${esc(String(v))}</span></div>`).join("") + `</div>`;
  }
  for (const c of (b.signed_contracts||[])) {
    h += `<div class="card"><div class="t">${esc(c.vendor_name)}</div>` +
      Object.entries(c).filter(([k])=>k!=="vendor_name").map(([k,v]) =>
        `<div class="kv"><span class="k">${esc(pretty(k))}</span><span class="v">${k==="bank_iban"?esc(maskIban(String(v))):esc(String(v))}</span></div>`).join("") + `</div>`;
  }
  if (b.engineering_status) {
    h += `<div class="card"><div class="t">Engineering Status</div>` +
      b.engineering_status.map(e => {
        const done = /merged|production|live|complete/i.test(e.status);
        return `<div style="padding:4px 0;border-top:1px solid var(--border)"><span class="stat-dot ${done?"ok":"warn"}"></span><b>${esc(e.feature)}</b><div style="color:var(--dim);font-size:11px;padding-left:14px">${esc(e.status)} · ${esc(e.date||"")}</div></div>`;
      }).join("") + `</div>`;
  }
  for (const [key,val] of Object.entries(b)) {
    if (["financial_rules","signed_contracts","engineering_status"].includes(key)) continue;
    h += `<div class="card"><div class="t">${esc(pretty(key))}</div>` +
      (typeof val === "object"
        ? Object.entries(val).map(([k,v])=>`<div class="kv"><span class="k">${esc(pretty(k))}</span><span class="v">${esc(String(v))}</span></div>`).join("")
        : `<div class="kv"><span class="v">${esc(String(val))}</span></div>`) + `</div>`;
  }
  return h;
}

async function loadBrain() {
  const b = await get("/brain");
  $("brain").innerHTML = b ? brainCards(b) : '<div class="empty">backend offline</div>';
}

let seenIds = new Set();
async function loadAudit() {
  const rows = await get("/audit-log?limit=30");
  if (!rows) { $("audit").innerHTML = '<tr><td colspan="4" class="empty">backend offline</td></tr>'; return; }
  if (!rows.length) { $("audit").innerHTML = '<tr><td colspan="4" class="empty">No actions yet — every decision lands here.</td></tr>'; return; }
  const fresh = new Set();
  $("audit").innerHTML = rows.map(r => {
    const isNew = !seenIds.has(r.audit_log_id); fresh.add(r.audit_log_id);
    const t = (r.ts||"").slice(11,19);
    return `<tr class="${isNew && seenIds.size ? "flash" : ""}"><td>${esc(t)}</td><td><b>${esc(r.action_type||"")}</b></td><td>${esc(r.audit_log_id||"")}</td><td>${esc(r.result||"—")}</td></tr>`;
  }).join("");
  seenIds = fresh;
}

async function loadHealth() {
  const t0 = performance.now();
  const h = await get("/health");
  const ms = (performance.now()-t0).toFixed(0);
  if (!h) { $("health").innerHTML = '<div class="empty">backend offline</div>'; return; }
  $("health").innerHTML =
    `<div class="card"><div class="kv"><span class="k">Engine</span><span class="v"><span class="tag">${esc(h.engine)}</span></span></div>` +
    `<div class="kv"><span class="k">Checks</span><span class="v">${h.checks}</span></div>` +
    `<div class="kv"><span class="k">Response</span><span class="v">${ms}ms</span></div>` +
    `<div style="margin-top:8px">${(h.brain_keys||[]).map(k=>`<span class="tag">${esc(k)}</span>`).join("")}</div></div>`;
}

loadBrain(); loadAudit(); loadHealth();
setInterval(loadAudit, 4000); setInterval(loadHealth, 4000);
</script>
</body>
</html>
