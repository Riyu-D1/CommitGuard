<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CommitGuard Plugin — simulator</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#2d3545;
    --text:#e6edf3; --dim:#8b98a9; --accent:#58a6ff;
    --crit:#f85149; --high:#f0883e; --med:#d29922; --ok:#3fb950;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:13px/1.5 -apple-system,"SF Mono",Menlo,monospace; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--border); }
  header h1 { font-size:15px; font-weight:600; }
  .chip { padding:2px 9px; border-radius:10px; font-size:11px; border:1px solid var(--border); color:var(--dim); }
  .healthdot { width:9px; height:9px; border-radius:50%; background:var(--dim); margin-left:auto; }
  .healthdot.ok { background:var(--ok); } .healthdot.bad { background:var(--crit); }
  main { display:grid; grid-template-columns:3fr 2fr; gap:0; flex:1; min-height:0; }
  .compose { padding:16px; border-right:1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
  .plugin { padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .plugin h2 { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  select, input, textarea { width:100%; background:var(--panel2); border:1px solid var(--border); border-radius:7px; color:var(--text); font:inherit; padding:8px 10px; }
  textarea { flex:1; min-height:200px; resize:none; }
  .status { display:flex; align-items:center; gap:8px; min-height:20px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); }
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--crit)} .dot.off{background:var(--dim)}
  .dot.checking { background:var(--med); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .meta { color:var(--dim); font-size:11px; margin-left:auto; }
  .v { border-left:3px solid var(--med); background:var(--panel2); border-radius:0 8px 8px 0; padding:9px 11px; margin:5px 0; }
  .v.CRITICAL{border-color:var(--crit)} .v.HIGH{border-color:var(--high)} .v.MEDIUM{border-color:var(--med)} .v.LOW{border-color:var(--dim)}
  .v .cat { font-size:10px; font-weight:700; letter-spacing:.05em; }
  .v.CRITICAL .cat{color:var(--crit)} .v.HIGH .cat{color:var(--high)} .v.MEDIUM .cat{color:var(--med)} .v.LOW .cat{color:var(--dim)}
  .v .issue { margin:4px 0; }
  .v .ev { font-size:10px; color:var(--accent); background:var(--panel); border-radius:4px; padding:3px 6px; margin:4px 0; display:inline-block; }
  .v .corr { font-size:11px; color:var(--ok); }
  .v .spanq { font-size:10px; color:var(--dim); font-style:italic; }
  .btn { background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:7px; padding:6px 11px; font:inherit; font-size:12px; cursor:pointer; }
  .btn:hover { border-color:var(--accent); }
  .btn.primary { background:var(--accent); color:#0d1117; border-color:var(--accent); font-weight:600; }
  .btn.danger { color:var(--crit); border-color:var(--crit); }
  .btn:disabled { opacity:.35; cursor:not-allowed; }
  .actions { display:flex; flex-wrap:wrap; gap:7px; }
  .audit { margin-top:auto; padding-top:10px; border-top:1px solid var(--border); }
  .audit .item { font-size:10px; color:var(--dim); padding:2px 0; }
  .audit .item b { color:var(--text); }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--ok); color:var(--ok); padding:9px 16px; border-radius:8px; display:none; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>CommitGuard Plugin — simulator</h1>
  <span class="chip" id="engine">engine: —</span>
  <span class="healthdot" id="health"></span>
</header>
<main>
  <section class="compose">
    <select id="scenario"><option value="">— load a scenario —</option></select>
    <input id="to" placeholder="To:">
    <input id="subject" placeholder="Subject:">
    <textarea id="draft" placeholder="Type or paste a draft / invoice here..."></textarea>
  </section>
  <section class="plugin">
    <h2>Plugin panel</h2>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText" style="color:var(--dim)">idle</span><span class="meta" id="meta"></span></div>
    <div id="violations"></div>
    <div class="actions">
      <button class="btn primary" id="sendBtn" disabled>Send</button>
      <button class="btn" id="fixBtn" disabled>Apply all fixes</button>
      <button class="btn" id="overrideBtn" disabled>Send anyway</button>
      <button class="btn danger" id="escalateBtn" style="display:none">Escalate to CFO</button>
      <button class="btn" id="stageBtn" style="display:none">Stage in Round</button>
    </div>
    <div class="audit" id="audit"><h2>Audit</h2></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script src="./adapter.js"></script>
<script>
const A = window.CommitGuardAdapter;
const $ = id => document.getElementById(id);
let lastResult = null, currentContext = "outgoing_email";

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3000);
}

async function pollHealth() {
  const h = await A.getHealth();
  $("health").className = "healthdot " + (h.ok ? "ok" : "bad");
}
pollHealth(); setInterval(pollHealth, 5000);

async function loadScenarios() {
  const s = await A.getScenarios();
  if (!s.ok) return;
  for (const [key, sc] of Object.entries(s)) {
    const o = document.createElement("option");
    o.value = key; o.textContent = sc.label;
    $("scenario").appendChild(o);
  }
  $("scenario").onchange = async () => {
    const key = $("scenario").value; if (!key) return;
    const sc = (await A.getScenarios())[key];
    currentContext = sc.context_type || "outgoing_email";
    $("draft").value = sc.text; verify();
  };
}
loadScenarios();

async function verify() {
  const text = $("draft").value.trim();
  if (!text) { reset(); return; }
  $("dot").className = "dot checking"; $("statusText").textContent = "checking…";
  const res = await A.verifyContext(text, currentContext);
  if (!res.ok) {
    $("dot").className = "dot off"; $("statusText").textContent = "backend offline — showing last result";
    return;
  }
  lastResult = res;
  $("engine").textContent = res.meta.engine === "rules+llm" ? "AI-enriched" : "local checks";
  $("meta").textContent = res.meta.latency_ms + "ms · " + res.meta.checks_run + " checks";

  if (res.status === "CLEAN") {
    $("dot").className = "dot ok"; $("statusText").textContent = "CLEAR — brain-backed send";
    $("violations").innerHTML = ""; $("sendBtn").disabled = false;
    $("fixBtn").disabled = $("overrideBtn").disabled = true;
    $("escalateBtn").style.display = $("stageBtn").style.display = "none";
    return;
  }
  $("dot").className = "dot bad";
  $("statusText").textContent = res.violations.length + " violation" + (res.violations.length>1?"s":"") + " — risk " + res.risk_level;
  $("violations").innerHTML = res.violations.map(v => `
    <div class="v ${v.severity}">
      <div class="cat">${v.severity} · ${v.category}</div>
      <div class="issue">${v.issue}</div>
      ${v.evidence ? `<div class="ev">brain: ${v.evidence.brain_key} = ${JSON.stringify(v.evidence.expected)} · found: ${JSON.stringify(v.evidence.found)}</div>` : ""}
      ${v.span ? `<div class="spanq">"${v.span.text}"</div>` : ""}
      <div class="corr">→ ${v.correction}</div>
    </div>`).join("");
  const hasCrit = res.violations.some(v => v.severity === "CRITICAL");
  $("sendBtn").disabled = true;
  $("fixBtn").disabled = !res.suggested_rewrite;
  $("overrideBtn").disabled = hasCrit;
  const invoiceLike = hasCrit || currentContext === "incoming_invoice";
  $("escalateBtn").style.display = hasCrit ? "" : "none";
  $("stageBtn").style.display = invoiceLike ? "" : "none";
}

$("draft").addEventListener("input", A.debounce(verify, 700));

$("fixBtn").onclick = () => {
  if (lastResult && lastResult.suggested_rewrite) {
    $("draft").value = lastResult.suggested_rewrite; verify();
  }
};
$("sendBtn").onclick = async () => {
  const r = await A.executeAction("SEND_APPROVED", { text: $("draft").value, context_type: currentContext });
  toast(r.ok ? r.message + " (" + r.audit_log_id + ")" : "action failed — backend offline");
};
$("overrideBtn").onclick = async () => {
  const reason = prompt("Override reason (written to audit log):");
  if (!reason) return;
  const r = await A.executeAction("APPROVE_OVERRIDE", { reason, text: $("draft").value, context_type: currentContext, violations: lastResult ? lastResult.violations : [] });
  toast(r.ok ? r.message + " (" + r.audit_log_id + ")" : "action failed");
};
$("escalateBtn").onclick = async () => {
  const r = await A.executeAction("ESCALATE_FRAUD", { text: $("draft").value, violations: lastResult ? lastResult.violations : [] });
  toast(r.ok ? r.message + " (" + r.audit_log_id + ")" : "action failed");
};
$("stageBtn").onclick = async () => {
  const r = await A.executeAction("STAGE_INVOICE", { text: $("draft").value });
  toast(r.ok ? r.message + " (" + r.audit_log_id + ")" : "action failed");
};

async function loadAudit() {
  const rows = await A.getAuditLog(6);
  if (!rows.ok) return;
  $("audit").innerHTML = '<h2>Audit</h2>' + rows.filter(r => r.action_type).map(r =>
    `<div class="item"><b>${r.action_type}</b> · ${r.audit_log_id}</div>`).join("");
}
loadAudit(); setInterval(loadAudit, 4000);

function reset() {
  $("dot").className = "dot"; $("statusText").textContent = "idle"; $("meta").textContent = "";
  $("violations").innerHTML = "";
  $("sendBtn").disabled = $("fixBtn").disabled = $("overrideBtn").disabled = true;
  $("escalateBtn").style.display = $("stageBtn").style.display = "none";
}
</script>
</body>
</html>
